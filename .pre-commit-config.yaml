repos:
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "4.2"]

  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b1
    hooks:
      - id: isort
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
