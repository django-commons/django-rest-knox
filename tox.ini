[tox]
envlist =
    py{311,312,313}-django52,
    py{312,313,314}-django60,
    py{312,313,314,315}-django61,

[testenv]
commands =
    python manage.py migrate
    coverage run manage.py test
    coverage report
setenv =
    DJANGO_SETTINGS_MODULE = knox_project.settings
    PIP_INDEX_URL = https://pypi.python.org/simple/
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    markdown>=3.0
    djangorestframework
    freezegun
    mkdocs
    pytest-django
    setuptools
    twine
    wheel
    coverage

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
